name: catchy-toilet

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: ../backend
    command: ["sh", "/app/docker-migrate.sh"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      APP_DB_USER: ${APP_DB_USER:-catchy_toilet_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a separate APP_DB_PASSWORD in backend/.env}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ../backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${APP_DB_USER:-catchy_toilet_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set a separate APP_DB_PASSWORD in backend/.env}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      MIN_STAT_SAMPLE_COUNT: ${MIN_STAT_SAMPLE_COUNT:-30}
      STAT_LOOKBACK_DAYS: ${STAT_LOOKBACK_DAYS:-56}
      ENABLE_STATISTICS_COLLECTION: ${ENABLE_STATISTICS_COLLECTION:-true}
      STAT_SENSOR_MAX_AGE_SECONDS: ${STAT_SENSOR_MAX_AGE_SECONDS:-300}
      RECOMMENDATION_DISTANCE_TOLERANCE: ${RECOMMENDATION_DISTANCE_TOLERANCE:-10}
      SENSOR_API_KEYS: '${SENSOR_API_KEYS:-{}}'
      ENABLE_SIMULATION: ${ENABLE_SIMULATION:-false}
      SIMULATION_API_KEY: ${SIMULATION_API_KEY:-}
      SENSOR_RATE_PER_SECOND: ${SENSOR_RATE_PER_SECOND:-0.2}
      SENSOR_RATE_BURST: ${SENSOR_RATE_BURST:-2}
      SENSOR_GLOBAL_RATE_PER_SECOND: ${SENSOR_GLOBAL_RATE_PER_SECOND:-5}
      SENSOR_GLOBAL_BURST: ${SENSOR_GLOBAL_BURST:-10}
      SENSOR_MIN_STATE_INTERVAL_SECONDS: ${SENSOR_MIN_STATE_INTERVAL_SECONDS:-1}
      SENSOR_EVENT_RETENTION_DAYS: ${SENSOR_EVENT_RETENTION_DAYS:-90}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-100}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-10}
      WS_ALLOWED_ORIGINS: '${WS_ALLOWED_ORIGINS:-[]}'
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8080","http://127.0.0.1:8080"]}'
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
