name: catchy_toilet
description: Real-time restroom availability for Catchy Toilet.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  cupertino_icons: ^1.0.9
  geolocator: ^14.1.2
  # iOS teardown fix: third_party/kakao_map_sdk/LOCAL_PATCH.md
  kakao_map_sdk:
    path: third_party/kakao_map_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/info/
    - assets/images/branding/logo.png
